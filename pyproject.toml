[project]
name = "salestalk-mcp"
version = "0.1.0"
description = "Chat with your sales database from Claude: a read-only MCP server over PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Hasnain Pirzada" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude", "postgresql", "text-to-sql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
salestalk-mcp = "salestalk_mcp.server:main"
salestalk-console = "salestalk_mcp.console:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salestalk_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs the seeded PostgreSQL from docker compose (skipped if unreachable)",
]
