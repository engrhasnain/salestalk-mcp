<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">SalesTalk MCP</title>
  <desc id="desc">Ask your sales database questions inside Claude. A read-only MCP server over PostgreSQL, with a console that shows every tool call.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="16"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)" font-family="'Instrument Sans', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect width="1280" height="400" fill="#0C0E1A"/>

    <!-- data constellation: city hubs and customers joined by thin solid lines -->
    <g stroke="#8E98FF" stroke-width="1" fill="none" stroke-opacity="0.28">
      <path d="M612 92 L668 60 L724 112 L676 150 Z"/>
      <path d="M612 92 L676 150 L640 206 L584 178 Z"/>
      <path d="M640 206 L700 258 L652 318 L594 284 Z"/>
      <path d="M676 150 L700 258"/>
      <path d="M584 178 L594 284"/>
      <path d="M700 258 L736 330 L652 318"/>
      <path d="M668 60 L760 30"/>
      <path d="M1236 380 L1196 372 L1224 336"/>
    </g>
    <g stroke="#6E7BFF" stroke-width="1.2" stroke-opacity="0.5" fill="none">
      <path d="M640 206 L612 92"/>
      <path d="M640 206 L700 258"/>
    </g>
    <!-- customers orbiting each city hub -->
    <g stroke="#AEB5FF" stroke-width="0.8" stroke-opacity="0.3" fill="none">
      <path d="M612 92 L592 70 L578 98 L596 118 Z"/>
      <path d="M612 92 L636 76"/>
      <path d="M640 206 L618 228 L626 248 L660 232 L666 190 Z"/>
      <path d="M640 206 L610 196"/>
      <path d="M700 258 L718 236 L726 280 L688 290 Z"/>
    </g>
    <g fill="#C9CCF5">
      <circle cx="592" cy="70" r="1.8" opacity="0.7"/>
      <circle cx="578" cy="98" r="1.5" opacity="0.6"/>
      <circle cx="596" cy="118" r="2" opacity="0.7"/>
      <circle cx="636" cy="76" r="1.6" opacity="0.6"/>
      <circle cx="618" cy="228" r="1.8" opacity="0.7"/>
      <circle cx="626" cy="248" r="1.5" opacity="0.6"/>
      <circle cx="660" cy="232" r="2.2" opacity="0.8"/>
      <circle cx="666" cy="190" r="1.7" opacity="0.6"/>
      <circle cx="610" cy="196" r="1.5" opacity="0.6"/>
      <circle cx="718" cy="236" r="1.6" opacity="0.6"/>
      <circle cx="726" cy="280" r="2" opacity="0.7"/>
      <circle cx="688" cy="290" r="1.5" opacity="0.6"/>
    </g>
    <g fill="#C9CCF5">
      <circle cx="668" cy="60" r="2.2" opacity="0.8"/>
      <circle cx="724" cy="112" r="2.6" opacity="0.9"/>
      <circle cx="676" cy="150" r="2" opacity="0.7"/>
      <circle cx="584" cy="178" r="2.4" opacity="0.8"/>
      <circle cx="594" cy="284" r="2" opacity="0.6"/>
      <circle cx="652" cy="318" r="2.6" opacity="0.8"/>
      <circle cx="736" cy="330" r="1.8" opacity="0.6"/>
      <circle cx="760" cy="30" r="1.8" opacity="0.6"/>
      <circle cx="1196" cy="372" r="2" opacity="0.6"/>
      <circle cx="1224" cy="336" r="1.8" opacity="0.5"/>
      <circle cx="1236" cy="380" r="2.2" opacity="0.6"/>
    </g>
    <g>
      <circle cx="612" cy="92" r="13" fill="none" stroke="#6E7BFF" stroke-opacity="0.45"/>
      <circle cx="612" cy="92" r="7" fill="#6E7BFF"/>
      <circle cx="612" cy="92" r="2.6" fill="#FFFFFF"/>
      <circle cx="640" cy="206" r="16" fill="none" stroke="#6E7BFF" stroke-opacity="0.45"/>
      <circle cx="640" cy="206" r="9" fill="#6E7BFF"/>
      <circle cx="640" cy="206" r="3.2" fill="#FFFFFF"/>
      <circle cx="700" cy="258" r="12" fill="none" stroke="#6E7BFF" stroke-opacity="0.45"/>
      <circle cx="700" cy="258" r="6" fill="#6E7BFF"/>
      <circle cx="700" cy="258" r="2.2" fill="#FFFFFF"/>
    </g>

    <!-- mark + wordmark -->
    <rect x="64" y="56" width="40" height="40" rx="10" fill="#6E7BFF"/>
    <g transform="translate(64 56) scale(1.25)">
      <g fill="none" stroke="#0C0E1A" stroke-width="1.8" stroke-linecap="round"><path d="M9 21.5 16 10l8 9.5"/><path d="M9 21.5h15"/></g>
      <g fill="#0C0E1A"><circle cx="16" cy="10" r="3.4"/><circle cx="9" cy="21.5" r="2.6"/><circle cx="24" cy="19.5" r="2.6"/></g>
    </g>
    <text x="118" y="84" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#F3F3FB" letter-spacing="-0.4">SalesTalk <tspan fill="#8E98FF" font-weight="600">MCP</tspan></text>

    <!-- headline -->
    <text x="62" y="170" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#F3F3FB">Ask your sales database</text>
    <text x="62" y="222" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#8E98FF">questions in Claude.</text>
    <text x="64" y="264" font-size="17" fill="#A6AACB">A read-only MCP server over PostgreSQL, plus a console that</text>
    <text x="64" y="289" font-size="17" fill="#A6AACB">shows every real tool call, JSON-RPC frame and refusal.</text>

    <!-- stack chips -->
    <g font-family="'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#F3F3FB">
      <rect x="64.5" y="320.5" width="72" height="30" rx="7" fill="#13162A" stroke="#282D4E"/>
      <text x="100.5" y="340.5" text-anchor="middle">Python</text>
      <rect x="144.5" y="320.5" width="80" height="30" rx="7" fill="#13162A" stroke="#282D4E"/>
      <text x="184.5" y="340.5" text-anchor="middle">MCP SDK</text>
      <rect x="232.5" y="320.5" width="104" height="30" rx="7" fill="#13162A" stroke="#282D4E"/>
      <text x="284.5" y="340.5" text-anchor="middle">PostgreSQL</text>
      <rect x="344.5" y="320.5" width="72" height="30" rx="7" fill="#13162A" stroke="#282D4E"/>
      <text x="380.5" y="340.5" text-anchor="middle">Docker</text>
      <rect x="424" y="320" width="80" height="31" rx="7" fill="#6E7BFF"/>
      <text x="464" y="340.5" text-anchor="middle" fill="#0C0E1A" font-weight="600">6 tools</text>
    </g>

    <!-- chat window -->
    <g filter="url(#lift)">
      <rect x="752" y="44" width="464" height="312" rx="14" fill="#FFFFFF"/>
    </g>
    <circle cx="776" cy="66" r="5" fill="#E2E0F2"/>
    <circle cx="794" cy="66" r="5" fill="#E2E0F2"/>
    <circle cx="812" cy="66" r="5" fill="#E2E0F2"/>
    <text x="984" y="71" font-size="13" fill="#5F6288" text-anchor="middle">Claude  ·  salestalk connected</text>
    <line x1="752" y1="88" x2="1216" y2="88" stroke="#ECEAF8"/>

    <!-- question -->
    <rect x="928" y="104" width="264" height="36" rx="10" fill="#ECEAF8"/>
    <text x="944" y="127" font-size="15" fill="#11132A">Top 5 customers last month?</text>

    <!-- tool call -->
    <rect x="776" y="154" width="214" height="26" rx="7" fill="#0C0E1A"/>
    <path d="M788 167l3 3 6-6" fill="none" stroke="#2FD39A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="804" y="171.5" font-family="'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#F3F3FB"><tspan fill="#8E98FF">query_sales</tspan>(last_month)</text>
    <text x="1000" y="171.5" font-family="'Geist Mono', Consolas, monospace" font-size="11" fill="#5F6288">read-only</text>

    <!-- answer -->
    <text x="776" y="208" font-size="14" font-weight="600" fill="#11132A">September 2026 · AED 1.69M from 409 orders</text>
    <g font-size="14" fill="#3B3E5E">
      <text x="776" y="238" font-family="Consolas, monospace" font-size="12" fill="#8B8EB0">1</text>
      <text x="794" y="238">Al Fajr Import &amp; Export</text>
      <rect x="1000" y="229" width="128" height="8" rx="2" fill="#5360F0"/>
      <text x="1192" y="238" text-anchor="end" font-family="Consolas, monospace" font-size="13">58,645</text>

      <text x="776" y="262" font-family="Consolas, monospace" font-size="12" fill="#8B8EB0">2</text>
      <text x="794" y="262">Al Noor Hypermarket</text>
      <rect x="1000" y="253" width="93" height="8" rx="2" fill="#C7CCFF"/>
      <text x="1192" y="262" text-anchor="end" font-family="Consolas, monospace" font-size="13">42,488</text>

      <text x="776" y="286" font-family="Consolas, monospace" font-size="12" fill="#8B8EB0">3</text>
      <text x="794" y="286">Al Safa Foodstuff Trading</text>
      <rect x="1000" y="277" width="83" height="8" rx="2" fill="#C7CCFF"/>
      <text x="1192" y="286" text-anchor="end" font-family="Consolas, monospace" font-size="13">38,084</text>

      <text x="776" y="310" font-family="Consolas, monospace" font-size="12" fill="#8B8EB0">4</text>
      <text x="794" y="310">Al Mubarak Foodstuff Trading</text>
      <rect x="1000" y="301" width="79" height="8" rx="2" fill="#C7CCFF"/>
      <text x="1192" y="310" text-anchor="end" font-family="Consolas, monospace" font-size="13">36,197</text>

      <text x="776" y="334" font-family="Consolas, monospace" font-size="12" fill="#8B8EB0">5</text>
      <text x="794" y="334">Al Rawabi Wholesale Market</text>
      <rect x="1000" y="325" width="77" height="8" rx="2" fill="#C7CCFF"/>
      <text x="1192" y="334" text-anchor="end" font-family="Consolas, monospace" font-size="13">35,466</text>
    </g>
  </g>
</svg>
